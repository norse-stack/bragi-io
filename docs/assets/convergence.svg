<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The same chapter in a PDF, a DOCX and a Markdown file is parsed by Bragi into one heading tree whose nodes carry content-derived names">
  <defs>
    <linearGradient id="bragiFlame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- self-contained card so it reads on any page background -->
  <rect x="1" y="1" width="898" height="378" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>

  <text x="450" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#e4e4e7">Three containers, one tree</text>

  <!-- ===== left: the three containers, each drawn as the structure it actually has ===== -->

  <!-- PDF: boxes on a page -->
  <g>
    <rect x="40" y="70" width="176" height="86" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="52" y="88" font-size="12" font-weight="700" fill="#d4d4d8">PDF</text>
    <text x="80" y="88" font-size="10.5" fill="#71717a">boxes on a page</text>
    <!-- a wider "heading" line, then two columns of body lines -->
    <rect x="52" y="102" width="84" height="5" rx="2" fill="#a1a1aa"/>
    <rect x="52" y="116" width="70" height="3" rx="1.5" fill="#52525b"/>
    <rect x="52" y="123" width="70" height="3" rx="1.5" fill="#52525b"/>
    <rect x="52" y="130" width="70" height="3" rx="1.5" fill="#52525b"/>
    <rect x="52" y="137" width="48" height="3" rx="1.5" fill="#52525b"/>
    <rect x="134" y="116" width="70" height="3" rx="1.5" fill="#52525b"/>
    <rect x="134" y="123" width="70" height="3" rx="1.5" fill="#52525b"/>
    <rect x="134" y="130" width="70" height="3" rx="1.5" fill="#52525b"/>
    <rect x="134" y="137" width="36" height="3" rx="1.5" fill="#52525b"/>
  </g>

  <!-- DOCX: named styles -->
  <g>
    <rect x="40" y="168" width="176" height="86" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="52" y="186" font-size="12" font-weight="700" fill="#d4d4d8">DOCX</text>
    <text x="92" y="186" font-size="10.5" fill="#71717a">named styles</text>
    <text x="52" y="206" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#93c5fd">Heading 2</text>
    <rect x="112" y="200" width="92" height="5" rx="2" fill="#a1a1aa"/>
    <text x="52" y="222" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#93c5fd">Normal</text>
    <rect x="112" y="216" width="92" height="3" rx="1.5" fill="#52525b"/>
    <rect x="112" y="223" width="64" height="3" rx="1.5" fill="#52525b"/>
    <text x="52" y="240" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#93c5fd">Heading 3</text>
    <rect x="112" y="234" width="76" height="5" rx="2" fill="#a1a1aa"/>
  </g>

  <!-- Markdown: structure in the syntax -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="40" y="266" width="176" height="86" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="52" y="284" font-size="12" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif" fill="#d4d4d8">Markdown</text>
    <text x="118" y="284" font-size="10.5" font-family="ui-sans-serif, system-ui, sans-serif" fill="#71717a">syntax</text>
    <text x="52" y="304" font-size="9.5" fill="#d4d4d8">## What Is Ownership?</text>
    <text x="52" y="319" font-size="9.5" fill="#71717a">text text text&#8230;</text>
    <text x="52" y="334" font-size="9.5" fill="#d4d4d8">### The Stack and the Heap</text>
  </g>

  <!-- ===== converging arrows into Bragi ===== -->
  <g stroke="#71717a" stroke-width="2" fill="none">
    <path d="M220 113 C 280 113, 280 207, 334 210"/>
    <path d="M220 211 H 334"/>
    <path d="M220 309 C 280 309, 280 216, 334 212"/>
  </g>
  <polygon points="336,211 324,205 324,217" fill="#71717a"/>

  <!-- ===== Bragi ===== -->
  <rect x="344" y="168" width="140" height="86" rx="14" fill="url(#bragiFlame)"/>
  <text x="414" y="219" text-anchor="middle" font-size="22" font-weight="800" fill="#18181b">bragi-io</text>

  <!-- arrow out -->
  <path d="M484 211 H 540" stroke="#71717a" stroke-width="2" fill="none"/>
  <polygon points="540,211 528,205 528,217" fill="#71717a"/>

  <!-- ===== right: the one tree, named (the first six nodes of a real parse) ===== -->
  <g>
    <rect x="548" y="70" width="312" height="282" rx="10" fill="#1f1f23" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="568" y="92" font-size="12.5" font-weight="700" fill="#86efac">bgraph</text>
    <text x="620" y="92" font-size="10.5" fill="#71717a">one heading tree &#183; every node named</text>

    <!-- tree edges -->
    <g stroke="#52525b" stroke-width="1.5" fill="none">
      <path d="M582 126 V 258"/>
      <path d="M582 160 H 600"/>
      <path d="M582 192 H 600"/>
      <path d="M582 224 H 600"/>
      <path d="M582 258 H 600"/>
      <path d="M616 274 V 306"/>
      <path d="M616 306 H 634"/>
    </g>

    <!-- nodes: a dot, a label, the path, the id in mono -->
    <g font-size="11.5" fill="#d4d4d8">
      <circle cx="582" cy="126" r="4" fill="#86efac"/>
      <text x="594" y="130">What Is Ownership?</text>
      <text x="594" y="142" font-size="9" fill="#71717a">section &#183; 1</text>

      <circle cx="604" cy="160" r="3.5" fill="#52525b"/>
      <text x="614" y="164">paragraph</text>
      <text x="614" y="176" font-size="9" fill="#71717a">1.1</text>

      <circle cx="604" cy="192" r="3.5" fill="#52525b"/>
      <text x="614" y="196">paragraph</text>
      <text x="614" y="208" font-size="9" fill="#71717a">1.2</text>

      <circle cx="604" cy="224" r="3.5" fill="#52525b"/>
      <text x="614" y="228">paragraph</text>
      <text x="614" y="240" font-size="9" fill="#71717a">1.3</text>

      <circle cx="604" cy="258" r="4" fill="#86efac"/>
      <text x="614" y="262">The Stack and the Heap</text>
      <text x="614" y="274" font-size="9" fill="#71717a">section &#183; 1.4</text>

      <circle cx="638" cy="306" r="3.5" fill="#52525b"/>
      <text x="648" y="310">paragraph</text>
      <text x="648" y="322" font-size="9" fill="#71717a">1.4.1</text>
    </g>
    <g font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#a1a1aa" text-anchor="end">
      <text x="842" y="130">04e9cd41&#8230;</text>
      <text x="842" y="164">2e817798&#8230;</text>
      <text x="842" y="196">77c0aa01&#8230;</text>
      <text x="842" y="228">9bc97908&#8230;</text>
      <text x="842" y="262">368dd071&#8230;</text>
      <text x="842" y="310">e1a6e983&#8230;</text>
    </g>
  </g>
</svg>
