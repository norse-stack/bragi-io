<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Reparsing after a one-paragraph edit: only the edited node's id changes, every other node keeps its id">
  <rect x="1" y="1" width="898" height="450" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="32" y="40" font-size="19" font-weight="700" fill="#0f172a">Edit one paragraph, reparse &#8212; the names hold</text>
  <text x="32" y="63" font-size="12.5" fill="#475569">A bgraph node&#8217;s id is derived from its content and its place in the tree, not from when you parsed it.</text>

  <!-- command -->
  <rect x="32" y="78" width="836" height="30" rx="7" fill="#0f172a"/>
  <text x="46" y="98" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e2e8f0">$ bragi parse -i notes.md -o notes.bgraph.json      # then edit one paragraph and run it again</text>

  <!-- header -->
  <g font-size="12" font-weight="700" fill="#64748b">
    <text x="46"  y="140">NODE</text>
    <text x="360" y="140">id before edit</text>
    <text x="560" y="140">id after edit</text>
    <text x="792" y="140" text-anchor="middle">result</text>
  </g>
  <line x1="32" y1="150" x2="868" y2="150" stroke="#e2e8f0" stroke-width="1.5"/>

  <g font-size="12.5">
    <!-- row template: y baseline steps of 44 -->
    <!-- 1 Section -->
    <text x="46"  y="178" fill="#0f172a" font-weight="600"># Field Notes</text>
    <text x="46"  y="194" fill="#94a3b8" font-size="11">section &#183; path 1</text>
    <text x="360" y="184" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">c4b9bbb2-8461&#8230;</text>
    <text x="560" y="184" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">c4b9bbb2-8461&#8230;</text>
    <text x="792" y="184" text-anchor="middle" fill="#16a34a" font-weight="700">kept</text>

    <!-- 1.1 Section -->
    <text x="46"  y="222" fill="#0f172a" font-weight="600">## Observations</text>
    <text x="46"  y="238" fill="#94a3b8" font-size="11">section &#183; path 1.1</text>
    <text x="360" y="228" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">c3b8ee61-13df&#8230;</text>
    <text x="560" y="228" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">c3b8ee61-13df&#8230;</text>
    <text x="792" y="228" text-anchor="middle" fill="#16a34a" font-weight="700">kept</text>

    <!-- 1.1.1 Paragraph -->
    <text x="46"  y="266" fill="#0f172a" font-weight="600">The tide came in slowly&#8230;</text>
    <text x="46"  y="282" fill="#94a3b8" font-size="11">paragraph &#183; path 1.1.1</text>
    <text x="360" y="272" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">8fd27c43-ad30&#8230;</text>
    <text x="560" y="272" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">8fd27c43-ad30&#8230;</text>
    <text x="792" y="272" text-anchor="middle" fill="#16a34a" font-weight="700">kept</text>

    <!-- 1.1.2 Paragraph EDITED -->
    <rect x="32" y="292" width="836" height="44" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <text x="46"  y="312" fill="#0f172a" font-weight="600">Gulls circled the lighthouse&#8230;</text>
    <text x="46"  y="328" fill="#b45309" font-size="11">paragraph &#183; path 1.1.2 &#183; the edited line</text>
    <text x="360" y="318" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-decoration="line-through">8ba6b53f-8beb&#8230;</text>
    <text x="560" y="318" fill="#b45309" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">d7f5e4a7-d5a0&#8230;</text>
    <text x="792" y="318" text-anchor="middle" fill="#d97706" font-weight="700">new id</text>

    <!-- 1.2 Section -->
    <text x="46"  y="360" fill="#0f172a" font-weight="600">## Method</text>
    <text x="46"  y="376" fill="#94a3b8" font-size="11">section &#183; path 1.2</text>
    <text x="360" y="366" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">a084fde9-fbda&#8230;</text>
    <text x="560" y="366" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">a084fde9-fbda&#8230;</text>
    <text x="792" y="366" text-anchor="middle" fill="#16a34a" font-weight="700">kept</text>

    <!-- 1.2.1 Paragraph -->
    <text x="46"  y="404" fill="#0f172a" font-weight="600">We recorded each sighting&#8230;</text>
    <text x="46"  y="420" fill="#94a3b8" font-size="11">paragraph &#183; path 1.2.1</text>
    <text x="360" y="410" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">6c4f1421-8521&#8230;</text>
    <text x="560" y="410" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">6c4f1421-8521&#8230;</text>
    <text x="792" y="410" text-anchor="middle" fill="#16a34a" font-weight="700">kept</text>
  </g>

  <text x="32" y="442" font-size="11" fill="#64748b">Real output. Only the edited paragraph gets a new id; every other node keeps its name byte-for-byte. (The document root re-keys too, since it spans the whole doc.)</text>
</svg>
